name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: deadlock_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d deadlock_pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (compile)
        run: python -m compileall app tests

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-min-32-characters
          DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/deadlock_pulse_test
          ENABLE_POLLER: "false"
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deadlock-pulse:ci .

      - name: Compose smoke test
        run: |
          docker compose up -d --wait
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/status
          docker compose down -v
